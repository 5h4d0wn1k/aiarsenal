[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiarsenal"
version = "1.0.0"
description = "Adversarial AI/ML security studio - poisoning, backdoors, extraction, prompt-injection, agentic red team (authorised lab use only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com" }]
keywords = ["ai-security", "adversarial-ml", "offensive-security", "red-team", "pentesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy", "scikit-learn"]
yaml = ["PyYAML"]
dev = ["pytest"]

[project.scripts]
aiarsenal = "aiarsenal.cli:main"

[tool.setuptools.packages.find]
include = ["aiarsenal*"]